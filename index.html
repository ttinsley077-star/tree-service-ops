<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.json" />
  <title>Tree Service Ops</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f8fafc;color:#0f172a}
    .app{max-width:720px;margin:auto;min-height:100vh;background:white}
    header{position:sticky;top:0;z-index:5;background:#0f172a;color:white;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
    header .title{font-weight:800;font-size:18px}.role-switch{background:#1e293b;border:1px solid #334155;color:white;border-radius:10px;padding:8px 10px}
    main{padding:16px 16px 90px}.hidden{display:none!important}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f1f5f9;border-radius:14px;padding:14px}
    .metric .n{font-size:25px;font-weight:800}.metric .l{font-size:12px;color:#475569;margin-top:2px}
    .section-title{font-weight:800;margin:22px 0 10px;font-size:18px}.card{border:1px solid #e2e8f0;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #00000008}
    .card h3{margin:0 0 4px}.muted{color:#64748b;font-size:13px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#e2e8f0;font-size:12px;font-weight:700;margin:8px 6px 0 0}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:12px;padding:11px 13px;font-weight:800;cursor:pointer}
    .btn.primary{background:#0f172a;color:white}.btn.good{background:#166534;color:white}.btn.warn{background:#b45309;color:white}.btn.light{background:#e2e8f0;color:#0f172a}
    .fab{position:fixed;bottom:22px;right:max(22px, calc((100vw - 720px)/2 + 22px));width:58px;height:58px;border-radius:50%;border:0;background:#166534;color:white;font-size:30px;box-shadow:0 8px 20px #0003}
    .tabs{display:flex;gap:8px;margin-bottom:16px}.tab{flex:1;border:0;border-radius:10px;padding:10px;font-weight:800;background:#e2e8f0}.tab.active{background:#0f172a;color:white}
    .form{display:grid;gap:10px}.form label{font-size:12px;font-weight:700;color:#475569}.form input,.form textarea,.form select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}
    .overlay{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:20}.sheet{background:white;width:100%;max-width:720px;margin:auto;border-radius:20px 20px 0 0;padding:18px;max-height:90vh;overflow:auto}
    .sheet h2{margin-top:0}.row{display:flex;gap:10px}.row>*{flex:1}.big-action{display:block;width:100%;padding:16px;margin-top:10px;border:0;border-radius:14px;font-size:16px;font-weight:900}
    .empty{padding:28px;text-align:center;color:#64748b}.money{font-weight:900}.topline{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div><div class="title">Tree Service Ops</div><div style="font-size:11px;color:#cbd5e1">Mobile Job & Quote Manager</div></div>
    <select id="role" class="role-switch">
      <option value="admin">Admin</option>
      <option value="manager">Field Manager</option>
    </select>
  </header>

  <main>
    <section id="adminView">
      <div class="grid" id="metrics"></div>
      <div class="section-title">Jobs & Quotes</div>
      <div class="tabs">
        <button class="tab active" data-filter="active">Active</button>
        <button class="tab" data-filter="complete">Complete</button>
        <button class="tab" data-filter="all">All</button>
      </div>
      <div id="adminJobs"></div>
      <button class="fab" id="newLeadBtn">+</button>
    </section>

    <section id="managerView" class="hidden">
      <div class="section-title" style="margin-top:0">Field Manager</div>
      <div class="muted" style="margin-bottom:14px">Only the actions you need are shown here.</div>
      <div id="managerJobs"></div>
    </section>
  </main>
</div>

<div id="modal" class="overlay hidden"><div class="sheet" id="sheet"></div></div>

<script>
const STATUS = {
  NEW:"New Lead",
  WAIT_MANAGER:"Waiting on Field Manager",
  WAIT_CUSTOMER:"Waiting on Customer",
  QUOTE_SCHEDULED:"Quote Scheduled",
  AWAITING_BID:"Awaiting Bid",
  FOLLOW_UP:"Follow-Up",
  WON:"Won / Scheduled",
  COMPLETE:"Complete",
  DECLINED:"Declined"
};

const seed = [
  {id:crypto.randomUUID(), name:"Sample Customer", phone:"555-0101", address:"123 Oak Lane", service:"Remove large oak near driveway", preferred:"Friday afternoon", quoteDate:"2026-08-28T14:00", status:STATUS.QUOTE_SCHEDULED, bid:0, jobDate:"", revenue:0, notes:"Gate on left side of house.", managerAccepted:true},
  {id:crypto.randomUUID(), name:"Example Lead", phone:"555-0134", address:"88 Pine Road", service:"Trim two maples", preferred:"Any weekday after 3 PM", quoteDate:"", status:STATUS.WAIT_MANAGER, bid:0, jobDate:"", revenue:0, notes:"", managerAccepted:false}
];

let jobs = JSON.parse(localStorage.getItem("treeJobs") || "null") || seed;
let filter = "active";

function save(){ localStorage.setItem("treeJobs", JSON.stringify(jobs)); render(); }
function currency(n){ return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(Number(n||0)); }
function activeJobs(){ return jobs.filter(j=>![STATUS.COMPLETE,STATUS.DECLINED].includes(j.status)); }

function nextAction(j){
  if(j.status===STATUS.NEW || j.status===STATUS.WAIT_MANAGER) return "Field manager: confirm availability";
  if(j.status===STATUS.WAIT_CUSTOMER) return "Admin: confirm time with customer";
  if(j.status===STATUS.QUOTE_SCHEDULED) return "Field manager: visit & submit bid";
  if(j.status===STATUS.AWAITING_BID) return "Field manager: enter bid";
  if(j.status===STATUS.FOLLOW_UP) return "Admin: follow up with customer";
  if(j.status===STATUS.WON) return "Field manager: complete scheduled job";
  if(j.status===STATUS.COMPLETE) return "Done";
  return "No action";
}

function renderMetrics(){
  const completed = jobs.filter(j=>j.status===STATUS.COMPLETE);
  const completedRevenue = completed.reduce((s,j)=>s+Number(j.revenue||j.bid||0),0);
  const booked = jobs.filter(j=>[STATUS.WON,STATUS.COMPLETE].includes(j.status)).reduce((s,j)=>s+Number(j.bid||0),0);
  const commission = completedRevenue*0.15;
  const awaiting = jobs.filter(j=>[STATUS.QUOTE_SCHEDULED,STATUS.AWAITING_BID].includes(j.status)).length;
  document.getElementById("metrics").innerHTML = [
    ["Active",activeJobs().length],
    ["Awaiting Bid",awaiting],
    ["Booked Revenue",currency(booked)],
    ["15% Commission",currency(commission)]
  ].map(([l,n])=>`<div class="metric"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");
}

function adminCard(j){
  return `<div class="card">
    <div class="topline">
      <div><h3>${esc(j.name)}</h3><div class="muted">${esc(j.address||"No address")}</div></div>
      <div class="pill">${esc(j.status)}</div>
    </div>
    <p style="margin:10px 0 4px">${esc(j.service||"")}</p>
    <div class="muted">Next: <b>${esc(nextAction(j))}</b></div>
    ${j.quoteDate?`<div class="muted">Quote: ${new Date(j.quoteDate).toLocaleString()}</div>`:""}
    ${j.bid?`<div style="margin-top:8px">Bid: <span class="money">${currency(j.bid)}</span></div>`:""}
    ${j.status===STATUS.COMPLETE?`<div>Commission: <span class="money">${currency((j.revenue||j.bid)*0.15)}</span></div>`:""}
    <div class="actions">
      <button class="btn light" onclick="openEdit('${j.id}')">Open</button>
      ${j.status===STATUS.WAIT_CUSTOMER?`<button class="btn primary" onclick="customerConfirmed('${j.id}')">Customer Confirmed</button>`:""}
      ${j.status===STATUS.AWAITING_BID && j.bid?`<button class="btn good" onclick="customerAccepted('${j.id}')">Customer Accepted</button><button class="btn warn" onclick="setFollowup('${j.id}')">Follow Up</button>`:""}
    </div>
  </div>`;
}

function renderAdmin(){
  let list = jobs;
  if(filter==="active") list = activeJobs();
  if(filter==="complete") list = jobs.filter(j=>j.status===STATUS.COMPLETE);
  document.getElementById("adminJobs").innerHTML = list.length?list.map(adminCard).join(""):`<div class="empty">No jobs in this view.</div>`;
}

function managerCard(j){
  const relevant=[STATUS.WAIT_MANAGER,STATUS.QUOTE_SCHEDULED,STATUS.AWAITING_BID,STATUS.WON].includes(j.status);
  if(!relevant) return "";
  return `<div class="card">
    <h3>${esc(j.name)}</h3>
    <div class="muted">${esc(j.address||"")}</div>
    <p>${esc(j.service||"")}</p>
    ${j.preferred?`<div class="muted">Customer availability: <b>${esc(j.preferred)}</b></div>`:""}
    ${j.quoteDate?`<div class="muted">Quote appointment: <b>${new Date(j.quoteDate).toLocaleString()}</b></div>`:""}
    ${j.notes?`<div class="pill">Note: ${esc(j.notes)}</div>`:""}
    ${j.status===STATUS.WAIT_MANAGER?`
      <button class="big-action" style="background:#166534;color:white" onclick="managerAccept('${j.id}')">✓ I CAN QUOTE THIS</button>
      <button class="big-action" style="background:#e2e8f0" onclick="managerUnavailable('${j.id}')">NOT AVAILABLE</button>`:""}
    ${[STATUS.QUOTE_SCHEDULED,STATUS.AWAITING_BID].includes(j.status)?`
      <button class="big-action" style="background:#0f172a;color:white" onclick="openBid('${j.id}')">SUBMIT BID</button>`:""}
    ${j.status===STATUS.WON?`
      <div style="margin-top:10px">Approved price: <span class="money">${currency(j.bid)}</span></div>
      ${j.jobDate?`<div class="muted">Job date: ${new Date(j.jobDate).toLocaleString()}</div>`:""}
      <button class="big-action" style="background:#166534;color:white" onclick="completeJob('${j.id}')">✓ JOB COMPLETE</button>`:""}
  </div>`;
}

function renderManager(){
  const html=jobs.map(managerCard).filter(Boolean).join("");
  document.getElementById("managerJobs").innerHTML=html||`<div class="empty">Nothing needs your action.</div>`;
}

function render(){ renderMetrics(); renderAdmin(); renderManager(); }

function esc(s){ return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])); }
function closeModal(){ document.getElementById("modal").classList.add("hidden"); }
function showModal(html){ document.getElementById("sheet").innerHTML=html; document.getElementById("modal").classList.remove("hidden"); }

function newLead(){
 showModal(`<h2>New Customer / Quote</h2>
 <div class="form">
   <label>Customer Name<input id="f_name"></label>
   <label>Phone<input id="f_phone" type="tel"></label>
   <label>Address<input id="f_address"></label>
   <label>Service Needed<textarea id="f_service"></textarea></label>
   <label>Customer Availability<input id="f_preferred" placeholder="e.g. Friday afternoon"></label>
   <label>Notes<textarea id="f_notes"></textarea></label>
   <button class="btn good" onclick="saveNewLead()">Create Quote Request</button>
   <button class="btn light" onclick="closeModal()">Cancel</button>
 </div>`);
}
function saveNewLead(){
 const j={id:crypto.randomUUID(),name:v("f_name"),phone:v("f_phone"),address:v("f_address"),service:v("f_service"),preferred:v("f_preferred"),notes:v("f_notes"),quoteDate:"",jobDate:"",bid:0,revenue:0,status:STATUS.WAIT_MANAGER,managerAccepted:false};
 jobs.unshift(j); closeModal(); save();
}
function v(id){return document.getElementById(id).value.trim();}

function managerAccept(id){
 const j=jobs.find(x=>x.id===id); j.managerAccepted=true; j.status=STATUS.WAIT_CUSTOMER; save();
}
function managerUnavailable(id){
 const j=jobs.find(x=>x.id===id); j.managerAccepted=false; j.status=STATUS.FOLLOW_UP; j.notes=(j.notes?j.notes+" | ":"")+"Field manager unavailable for requested time."; save();
}
function customerConfirmed(id){
 const j=jobs.find(x=>x.id===id);
 showModal(`<h2>Schedule Quote</h2><div class="form">
 <label>Quote Date & Time<input id="quote_dt" type="datetime-local"></label>
 <button class="btn good" onclick="saveQuoteDate('${id}')">Confirm Quote</button><button class="btn light" onclick="closeModal()">Cancel</button></div>`);
}
function saveQuoteDate(id){
 const j=jobs.find(x=>x.id===id); j.quoteDate=v("quote_dt"); j.status=STATUS.QUOTE_SCHEDULED; closeModal(); save();
}
function openBid(id){
 showModal(`<h2>Submit Bid</h2><div class="form">
 <label>Bid Price ($)<input id="bid_amt" type="number" inputmode="decimal" min="0"></label>
 <label>Field Notes<textarea id="bid_notes"></textarea></label>
 <button class="btn good" onclick="saveBid('${id}')">Submit Bid</button><button class="btn light" onclick="closeModal()">Cancel</button></div>`);
}
function saveBid(id){
 const j=jobs.find(x=>x.id===id); j.bid=Number(v("bid_amt")); const n=v("bid_notes"); if(n) j.notes=(j.notes?j.notes+" | ":"")+n; j.status=STATUS.AWAITING_BID; closeModal(); save();
}
function customerAccepted(id){
 showModal(`<h2>Schedule Job</h2><div class="form"><label>Job Date & Time<input id="job_dt" type="datetime-local"></label>
 <button class="btn good" onclick="saveJobDate('${id}')">Book Job</button><button class="btn light" onclick="closeModal()">Cancel</button></div>`);
}
function saveJobDate(id){
 const j=jobs.find(x=>x.id===id); j.jobDate=v("job_dt"); j.status=STATUS.WON; closeModal(); save();
}
function setFollowup(id){ const j=jobs.find(x=>x.id===id); j.status=STATUS.FOLLOW_UP; save(); }
function completeJob(id){
 const j=jobs.find(x=>x.id===id); j.status=STATUS.COMPLETE; j.revenue=Number(j.bid||0); save();
}
function openEdit(id){
 const j=jobs.find(x=>x.id===id);
 showModal(`<h2>${esc(j.name)}</h2><div class="form">
 <label>Phone<input id="e_phone" value="${esc(j.phone)}"></label>
 <label>Address<input id="e_address" value="${esc(j.address)}"></label>
 <label>Service<textarea id="e_service">${esc(j.service)}</textarea></label>
 <label>Status<select id="e_status">${Object.values(STATUS).map(s=>`<option ${s===j.status?"selected":""}>${s}</option>`).join("")}</select></label>
 <label>Bid Price<input id="e_bid" type="number" value="${Number(j.bid||0)}"></label>
 <label>Notes<textarea id="e_notes">${esc(j.notes||"")}</textarea></label>
 <button class="btn good" onclick="saveEdit('${id}')">Save</button>
 <button class="btn light" onclick="closeModal()">Close</button>
 </div>`);
}
function saveEdit(id){
 const j=jobs.find(x=>x.id===id); j.phone=v("e_phone");j.address=v("e_address");j.service=v("e_service");j.status=document.getElementById("e_status").value;j.bid=Number(v("e_bid"));j.notes=v("e_notes"); closeModal(); save();
}

document.getElementById("role").addEventListener("change",e=>{
 const admin=e.target.value==="admin";
 document.getElementById("adminView").classList.toggle("hidden",!admin);
 document.getElementById("managerView").classList.toggle("hidden",admin);
});
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.filter;renderAdmin();
}));
document.getElementById("newLeadBtn").addEventListener("click",newLead);
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
if("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js").catch(()=>{});
render();
</script>
</body>
</html>
