<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>Tree Service Ops — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f8fafc;color:#0f172a}.app{max-width:760px;margin:auto;min-height:100vh;background:#fff}header{background:#0f172a;color:#fff;padding:14px 16px}.title{font-weight:800;font-size:18px}main{padding:16px 16px 90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f1f5f9;border-radius:14px;padding:14px}.metric .n{font-size:25px;font-weight:800}.metric .l{font-size:12px;color:#475569}.section-title{font-weight:800;margin:22px 0 10px;font-size:18px}.card{border:1px solid #e2e8f0;border-radius:16px;padding:14px;margin-bottom:12px}.muted{color:#64748b;font-size:13px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#e2e8f0;font-size:12px;font-weight:700}.btn{border:0;border-radius:12px;padding:11px 13px;font-weight:800;cursor:pointer}.primary{background:#0f172a;color:#fff}.good{background:#166534;color:#fff}.warn{background:#b45309;color:#fff}.light{background:#e2e8f0}.fab{position:fixed;bottom:22px;right:max(22px,calc((100vw - 760px)/2 + 22px));width:58px;height:58px;border-radius:50%;border:0;background:#166534;color:#fff;font-size:30px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.overlay{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:20}.sheet{background:#fff;width:100%;max-width:760px;margin:auto;border-radius:20px 20px 0 0;padding:18px;max-height:90vh;overflow:auto}.hidden{display:none!important}.form{display:grid;gap:10px}.form input,.form textarea,.form select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.money{font-weight:900}</style></head>
<body><div class="app"><header><div class="title">Tree Service Ops</div><div style="font-size:11px;color:#cbd5e1">Admin</div></header><main>
<div class="grid" id="metrics"></div><div class="section-title">Jobs & Quotes</div><div id="jobs"></div><button class="fab" onclick="newLead()">+</button>
</main></div><div id="modal" class="overlay hidden"><div class="sheet" id="sheet"></div></div>
<script>
const sb=supabase.createClient("https://vblvgqbaaywrwmzvtruq.supabase.co","sb_publishable_j_gLY2n3MrQ4hCSFqKC4ug_nJaU29Ta");
let jobs=[];
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function money(n){return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(Number(n||0))}
function nextAction(s){return {"Waiting on Field Manager":"Field manager: confirm availability","Waiting on Customer":"Admin: confirm time with customer","Quote Scheduled":"Field manager: visit & submit bid","Awaiting Bid":"Admin: review bid / follow up","Follow-Up":"Admin: follow up with customer","Won / Scheduled":"Field manager: complete job","Complete":"Done"}[s]||"No action"}
async function load(){let r=await sb.from("jobs").select("*").order("created_at",{ascending:false});if(r.error)return alert(r.error.message);jobs=r.data||[];render()}
function render(){const active=jobs.filter(j=>!["Complete","Declined"].includes(j.status)).length;const booked=jobs.filter(j=>["Won / Scheduled","Complete"].includes(j.status)).reduce((s,j)=>s+Number(j.bid||0),0);const completed=jobs.filter(j=>j.status==="Complete").reduce((s,j)=>s+Number(j.bid||0),0);const commission=completed*.15;metrics.innerHTML=[["Active",active],["Booked Revenue",money(booked)],["Completed Revenue",money(completed)],["15% Commission",money(commission)]].map(x=>`<div class="metric"><div class="n">${x[1]}</div><div class="l">${x[0]}</div></div>`).join("");jobsEl=document.getElementById("jobs");jobsEl.innerHTML=jobs.map(j=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><div><b>${esc(j.customer_name)}</b><div class="muted">${esc(j.address||"")}</div></div><span class="pill">${esc(j.status)}</span></div><p>${esc(j.service||"")}</p><div class="muted">Next: <b>${nextAction(j.status)}</b></div>${j.bid?`<div>Bid: <span class="money">${money(j.bid)}</span></div>`:""}<div class="actions"><button class="btn light" onclick="editJob('${j.id}')">Open</button>${j.status==="Waiting on Customer"?`<button class="btn primary" onclick="scheduleQuote('${j.id}')">Customer Confirmed</button>`:""}${j.status==="Awaiting Bid"&&j.bid?`<button class="btn good" onclick="scheduleJob('${j.id}')">Customer Accepted</button><button class="btn warn" onclick="updateStatus('${j.id}','Follow-Up')">Follow Up</button>`:""}</div></div>`).join("")}
function show(h){sheet.innerHTML=h;modal.classList.remove("hidden")}function closeM(){modal.classList.add("hidden")}
function newLead(){show(`<h2>New Customer / Quote</h2><div class="form"><input id="n1" placeholder="Customer name"><input id="n2" placeholder="Phone"><input id="n3" placeholder="Address"><textarea id="n4" placeholder="Service needed"></textarea><input id="n5" placeholder="Customer availability"><textarea id="n6" placeholder="Notes"></textarea><button class="btn good" onclick="saveLead()">Create Quote Request</button><button class="btn light" onclick="closeM()">Cancel</button></div>`)}
async function saveLead(){let r=await sb.from("jobs").insert({customer_name:n1.value,phone:n2.value,address:n3.value,service:n4.value,preferred_availability:n5.value,notes:n6.value,status:"Waiting on Field Manager",created_by:null});if(r.error)alert(r.error.message);else closeM()}
async function updateStatus(id,status){let r=await sb.from("jobs").update({status}).eq("id",id);if(r.error)alert(r.error.message)}
function scheduleQuote(id){show(`<h2>Schedule Quote</h2><div class="form"><input id="qd" type="datetime-local"><button class="btn good" onclick="saveQuote('${id}')">Confirm Quote</button></div>`)}
async function saveQuote(id){let r=await sb.from("jobs").update({quote_date:new Date(qd.value).toISOString(),status:"Quote Scheduled"}).eq("id",id);if(r.error)alert(r.error.message);else closeM()}
function scheduleJob(id){show(`<h2>Schedule Job</h2><div class="form"><input id="jd" type="datetime-local"><button class="btn good" onclick="saveJob('${id}')">Book Job</button></div>`)}
async function saveJob(id){let r=await sb.from("jobs").update({job_date:new Date(jd.value).toISOString(),status:"Won / Scheduled"}).eq("id",id);if(r.error)alert(r.error.message);else closeM()}
function editJob(id){let j=jobs.find(x=>x.id===id);show(`<h2>${esc(j.customer_name)}</h2><div class="form"><input id="e1" value="${esc(j.phone||"")}"><input id="e2" value="${esc(j.address||"")}"><textarea id="e3">${esc(j.service||"")}</textarea><select id="e4">${["Waiting on Field Manager","Waiting on Customer","Quote Scheduled","Awaiting Bid","Follow-Up","Won / Scheduled","Complete","Declined"].map(s=>`<option ${s===j.status?"selected":""}>${s}</option>`).join("")}</select><input id="e5" type="number" value="${Number(j.bid||0)}"><textarea id="e6">${esc(j.notes||"")}</textarea><button class="btn good" onclick="saveEdit('${id}')">Save</button></div>`)}
async function saveEdit(id){let r=await sb.from("jobs").update({phone:e1.value,address:e2.value,service:e3.value,status:e4.value,bid:Number(e5.value||0),notes:e6.value}).eq("id",id);if(r.error)alert(r.error.message);else closeM()}
modal.onclick=e=>{if(e.target.id==="modal")closeM()};sb.channel("admin-jobs").on("postgres_changes",{event:"*",schema:"public",table:"jobs"},()=>load()).subscribe();load();
</script></body></html>
