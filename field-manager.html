<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>Tree Service Ops — Field Manager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#f8fafc;color:#0f172a}.app{max-width:720px;margin:auto;min-height:100vh;background:#fff}header{background:#0f172a;color:#fff;padding:14px 16px}main{padding:16px 16px 60px}.title{font-weight:800}.card{border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin-bottom:12px}.muted{color:#64748b;font-size:13px}.big{display:block;width:100%;padding:16px;margin-top:10px;border:0;border-radius:14px;font-weight:900;font-size:16px}.good{background:#166534;color:white}.dark{background:#0f172a;color:white}.light{background:#e2e8f0}.overlay{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end}.sheet{background:white;width:100%;max-width:720px;margin:auto;border-radius:20px 20px 0 0;padding:18px}.hidden{display:none!important}.form{display:grid;gap:10px}input,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.pill{display:inline-block;background:#e2e8f0;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}</style></head>
<body><div class="app"><header><div class="title">Tree Service Ops</div><div style="font-size:11px;color:#cbd5e1">Field Manager</div></header><main><h2>My Quotes & Jobs</h2><div class="muted" style="margin-bottom:14px">Only items needing your action appear here.</div><div id="jobs"></div></main></div><div id="modal" class="overlay hidden"><div class="sheet" id="sheet"></div></div>
<script>
const sb=supabase.createClient("https://vblvgqbaaywrwmzvtruq.supabase.co","sb_publishable_j_gLY2n3MrQ4hCSFqKC4ug_nJaU29Ta");let data=[];
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function load(){let r=await sb.from("jobs").select("id,customer_name,phone,address,service,preferred_availability,quote_date,status,bid,job_date,notes,manager_accepted").order("created_at",{ascending:false});if(r.error)return alert(r.error.message);data=r.data||[];render()}
function render(){let arr=data.filter(j=>["Waiting on Field Manager","Quote Scheduled","Awaiting Bid","Won / Scheduled"].includes(j.status));jobs.innerHTML=arr.map(j=>`<div class="card"><b>${esc(j.customer_name)}</b><div class="muted">${esc(j.address||"")}</div>${j.phone?`<div><a href="tel:${esc(j.phone)}">Call ${esc(j.phone)}</a></div>`:""}<p>${esc(j.service||"")}</p>${j.preferred_availability?`<div class="muted">Customer availability: <b>${esc(j.preferred_availability)}</b></div>`:""}${j.quote_date?`<div class="muted">Quote: <b>${new Date(j.quote_date).toLocaleString()}</b></div>`:""}${j.notes?`<div class="pill">${esc(j.notes)}</div>`:""}${j.status==="Waiting on Field Manager"?`<button class="big good" onclick="accept('${j.id}')">✓ I CAN QUOTE THIS</button><button class="big light" onclick="unavail('${j.id}')">NOT AVAILABLE</button>`:""}${["Quote Scheduled","Awaiting Bid"].includes(j.status)?`<button class="big dark" onclick="bid('${j.id}')">SUBMIT BID</button>`:""}${j.status==="Won / Scheduled"?`<div style="margin-top:10px">Approved price: <b>${Number(j.bid||0).toLocaleString("en-US",{style:"currency",currency:"USD"})}</b></div>${j.job_date?`<div class="muted">Job date: ${new Date(j.job_date).toLocaleString()}</div>`:""}<button class="big good" onclick="complete('${j.id}')">✓ JOB COMPLETE</button>`:""}</div>`).join("")||'<div class="muted">Nothing needs your action.</div>'}
async function accept(id){let r=await sb.from("jobs").update({manager_accepted:true,status:"Waiting on Customer"}).eq("id",id);if(r.error)alert(r.error.message)}
async function unavail(id){let r=await sb.from("jobs").update({manager_accepted:false,status:"Follow-Up",notes:"Field manager unavailable for requested time."}).eq("id",id);if(r.error)alert(r.error.message)}
function show(h){sheet.innerHTML=h;modal.classList.remove("hidden")}function closeM(){modal.classList.add("hidden")}
function bid(id){show(`<h2>Submit Bid</h2><div class="form"><input id="b1" type="number" placeholder="Bid price"><textarea id="b2" placeholder="Field notes"></textarea><button class="big good" onclick="saveBid('${id}')">Submit Bid</button></div>`)}
async function saveBid(id){let r=await sb.from("jobs").update({bid:Number(b1.value||0),notes:b2.value,status:"Awaiting Bid"}).eq("id",id);if(r.error)alert(r.error.message);else closeM()}
async function complete(id){let r=await sb.from("jobs").update({status:"Complete"}).eq("id",id);if(r.error)alert(r.error.message)}
modal.onclick=e=>{if(e.target.id==="modal")closeM()};sb.channel("manager-jobs").on("postgres_changes",{event:"*",schema:"public",table:"jobs"},()=>load()).subscribe();load();
</script></body></html>
