<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>Tree Service Ops — Field Manager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#f8fafc;color:#0f172a}.app{max-width:720px;margin:auto;min-height:100vh;background:#fff}header{background:#0f172a;color:#fff;padding:14px 16px}main{padding:16px 16px 60px}.title{font-weight:800}.card{border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin-bottom:12px}.muted{color:#64748b;font-size:13px}.big{display:block;width:100%;padding:16px;margin-top:10px;border:0;border-radius:14px;font-weight:900;font-size:16px}.good{background:#166534;color:white}.dark{background:#0f172a;color:white}.light{background:#e2e8f0}.overlay{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:20}.sheet{background:white;width:100%;max-width:720px;margin:auto;border-radius:20px 20px 0 0;padding:18px;max-height:92vh;overflow:auto}.hidden{display:none!important}.form{display:grid;gap:10px}input,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.pill{display:inline-block;background:#e2e8f0;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.avail{background:#f1f5f9;border-radius:12px;padding:10px;margin-top:8px}
</style></head>
<body><div class="app"><header><div class="title">Tree Service Ops</div><div style="font-size:11px;color:#cbd5e1">Field Manager</div></header><main><h2>Quotes & Jobs</h2><div class="muted" style="margin-bottom:14px">Open a quote, review the details, and submit when you're available.</div><div id="jobs"></div></main></div><div id="modal" class="overlay hidden"><div class="sheet" id="sheet"></div></div>
<script>
const sb=supabase.createClient("https://vblvgqbaaywrwmzvtruq.supabase.co","sb_publishable_j_gLY2n3MrQ4hCSFqKC4ug_nJaU29Ta");let data=[];
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function fmt(d){return d?new Date(d).toLocaleString():""}
async function load(){let r=await sb.from("jobs").select("id,customer_name,phone,address,service,preferred_availability,quote_date,status,bid,job_date,notes,manager_accepted,manager_availability,manager_availability_note").order("created_at",{ascending:false});if(r.error)return alert(r.error.message);data=r.data||[];render()}
function render(){
 let arr=data.filter(j=>["Waiting on Field Manager","Waiting on Customer","Quote Scheduled","Awaiting Bid","Won / Scheduled"].includes(j.status));
 jobs.innerHTML=arr.map(j=>{
   let submitted=(j.manager_availability||[]).length>0;
   return `<div class="card">
   <div style="display:flex;justify-content:space-between;gap:10px"><div><b>${esc(j.customer_name)}</b><div class="muted">${esc(j.address||"")}</div></div><span class="pill">${esc(j.status)}</span></div>
   <p>${esc(j.service||"")}</p>
   ${j.status==="Waiting on Field Manager"?`<button class="big dark" onclick="openQuote('${j.id}')">${submitted?"UPDATE AVAILABILITY":"OPEN QUOTE"}</button>`:""}
   ${j.status==="Waiting on Customer"&&submitted?`<div class="avail"><b>Availability submitted</b><div class="muted">Waiting for customer confirmation.</div></div>`:""}
   ${["Quote Scheduled","Awaiting Bid"].includes(j.status)?`<button class="big dark" onclick="bid('${j.id}')">SUBMIT BID</button>`:""}
   ${j.status==="Won / Scheduled"?`<div style="margin-top:10px">Approved price: <b>${Number(j.bid||0).toLocaleString("en-US",{style:"currency",currency:"USD"})}</b></div>${j.job_date?`<div class="muted">Job date: ${fmt(j.job_date)}</div>`:""}<button class="big good" onclick="complete('${j.id}')">✓ JOB COMPLETE</button>`:""}
   </div>`;
 }).join("")||'<div class="muted">Nothing needs your action.</div>'
}
function show(h){sheet.innerHTML=h;modal.classList.remove("hidden")}function closeM(){modal.classList.add("hidden")}
function openQuote(id){
 let j=data.find(x=>x.id===id); let a=j.manager_availability||[];
 show(`<h2>${esc(j.customer_name)}</h2>
 <div class="muted">${esc(j.address||"")}</div>
 ${j.phone?`<p><a href="tel:${esc(j.phone)}">Call ${esc(j.phone)}</a></p>`:""}
 <p><b>Work requested</b><br>${esc(j.service||"")}</p>
 ${j.preferred_availability?`<p><b>Customer availability</b><br>${esc(j.preferred_availability)}</p>`:""}
 ${j.notes?`<p><b>Admin notes</b><br>${esc(j.notes)}</p>`:""}
 <hr style="border:0;border-top:1px solid #e2e8f0;margin:16px 0">
 <h3>Your quote availability</h3><div class="muted">Enter one or more times that work for you. Tyler will coordinate one with the customer.</div>
 <div class="form" style="margin-top:12px">
 <input id="a1" type="datetime-local" value="${a[0]?new Date(a[0]).toISOString().slice(0,16):""}">
 <input id="a2" type="datetime-local" value="${a[1]?new Date(a[1]).toISOString().slice(0,16):""}">
 <input id="a3" type="datetime-local" value="${a[2]?new Date(a[2]).toISOString().slice(0,16):""}">
 <textarea id="an" placeholder="Optional note">${esc(j.manager_availability_note||"")}</textarea>
 <button class="big good" onclick="saveAvailability('${id}')">SUBMIT AVAILABILITY</button>
 <button class="big light" onclick="unavail('${id}')">I'M NOT AVAILABLE</button>
 </div>`)
}
async function saveAvailability(id){
 let vals=[a1.value,a2.value,a3.value].filter(Boolean).map(v=>new Date(v).toISOString());
 if(!vals.length)return alert("Please enter at least one available date/time.");
 let r=await sb.from("jobs").update({manager_availability:vals,manager_availability_note:an.value,manager_accepted:true,status:"Waiting on Customer"}).eq("id",id);
 if(r.error)alert(r.error.message);else closeM()
}
async function unavail(id){
 let r=await sb.from("jobs").update({manager_availability:[],manager_availability_note:"Field manager unavailable for this quote.",manager_accepted:false,status:"Follow-Up"}).eq("id",id);
 if(r.error)alert(r.error.message);else closeM()
}
function bid(id){show(`<h2>Submit Bid</h2><div class="form"><input id="b1" type="number" placeholder="Bid price"><textarea id="b2" placeholder="Field notes"></textarea><button class="big good" onclick="saveBid('${id}')">Submit Bid</button></div>`)}
async function saveBid(id){let r=await sb.from("jobs").update({bid:Number(b1.value||0),notes:b2.value,status:"Awaiting Bid"}).eq("id",id);if(r.error)alert(r.error.message);else closeM()}
async function complete(id){let r=await sb.from("jobs").update({status:"Complete"}).eq("id",id);if(r.error)alert(r.error.message)}
modal.onclick=e=>{if(e.target.id==="modal")closeM()};sb.channel("manager-jobs").on("postgres_changes",{event:"*",schema:"public",table:"jobs"},()=>load()).subscribe();load();
</script></body></html>
